services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_MANAGER_DEMO_PASSWORD: ${KEYCLOAK_MANAGER_DEMO_PASSWORD}
      KEYCLOAK_EMPLOYEE_DEMO_PASSWORD: ${KEYCLOAK_EMPLOYEE_DEMO_PASSWORD}
      # Temporary mitigation for CVE-2026-114938 until the image contains a patched JDK
      JAVA_OPTS_APPEND: "-XX:-UseBASE64Intrinsics"
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
  keycloak-data: